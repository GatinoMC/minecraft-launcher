name: Deploy Github Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - README.md
      - CONTRIBUTE.md
      - 'packages/*/README.md'
  workflow_dispatch:

jobs:
  page-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    - name: Install
      run: |
        pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Build Docs
      run: |
        pnpm build:docs
    - name: Deploy to Github Pages
      uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
      with:
        target_branch: gh-pages
        build_dir: docs/
      env:
        GH_PAT: ${{ secrets.PAT_GITHUB_TOKEN }}
    - name: Notify the xmcl-page
      uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1
      with:
        token: ${{ secrets.PAT_GITHUB_TOKEN }}
        repo: Voxelum/xmcl-page
        workflow: deploy.yaml
