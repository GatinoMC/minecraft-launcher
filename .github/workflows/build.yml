name: Build

on:
  push:
    branches:
      - main
    paths:
      - "xmcl-runtime/**"
      - "xmcl-runtime-api/**"
      - "xmcl-keystone-ui/**"
      - "xmcl-electron-app/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Redirect Electron / electron-builder caches to a workspace-local path
      # so a single `path:` works on Linux, macOS, and Windows.
      # @electron/get honors ELECTRON_CACHE; electron-builder honors ELECTRON_BUILDER_CACHE.
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Fix node-gyp and Python
        if: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
        run: python3 -m pip install --break-system-packages --user packaging setuptools
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: "pnpm"
      - name: Cache Electron binaries
        # Restored before `pnpm install` so the electron postinstall
        # (@electron/get) sees the cache and skips re-downloading the zip.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          # No restore-keys: a partial hit on a different electron version
          # would still force a redownload, so the fallback adds no value.
      - name: Cache Vite deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: xmcl-keystone-ui/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'xmcl-keystone-ui/vite.config.ts') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Setup Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Build
        run: |
          pnpm run --prefix xmcl-keystone-ui build
          pnpm run --prefix xmcl-electron-app build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_OPTIONS: --max-old-space-size=32768
          NODE_ENV: production
          RELEASE: ${{ startsWith(github.event.head_commit.message, 'chore(release)') }}
          PUBLISHER: CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US
      - name: Upload Source Maps
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sourcemap
          path: |
            xmcl-electron-app/dist/*.js.map
            xmcl-electron-app/dist/renderer/assets/*.js.map
      - name: Upload Build
        # Windows .appx in this artifact is UNSIGNED. The `release` job
        # publishes it to a *draft* release; signing happens out-of-band via
        # the manual `Sign Release` workflow before the draft is published.
        if: ${{ startsWith(github.event.head_commit.message, 'chore(release)') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-${{ runner.os }}
          path: |
            xmcl-electron-app/build/output/
      - name: Upload Windows Zip Build
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: win-b${{ github.run_number }}
          path: |
            xmcl-electron-app/build/output/win-unpacked/
      - name: Upload Linux x64 Zip Build
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-b${{ github.run_number }}-x64
          path: |
            xmcl-electron-app/build/output/linux-unpacked/
      - name: Upload Linux arm64 Zip Build
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-b${{ github.run_number }}-arm64
          path: |
            xmcl-electron-app/build/output/linux-arm64-unpacked/
      - name: Upload Mac x64 Zip Build
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mac-b${{ github.run_number }}-x64
          path: |
            xmcl-electron-app/build/output/mac/
      - name: Upload Mac arm64 Zip Build
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mac-b${{ github.run_number }}-arm64
          path: |
            xmcl-electron-app/build/output/mac-arm64/

  build-arch:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ false }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            pkg_arch: amd64
          - arch: aarch64
            pkg_arch: arm64
    container: archlinux:latest
    steps:
      - name: Install Dependencies
        run: |
          pacman -Syu --noconfirm base-devel nodejs npm
      - name: Install Git
        run: |
          pacman -S --noconfirm git
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # build-arch only needs `package.json` from the working tree;
          # full history is here only so this comment block is consistent
          # with the other jobs. The job is currently disabled (`if: false`).
          filter: blob:none
      - name: Download Ubuntu Build Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-Linux
          path: ./
      - name: Extract version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Build Package
        run: |
          mkdir -p build
          cd build
          useradd builder -m
          chown -R builder:builder ./

          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp "../xmcl-${{ steps.version.outputs.version }}-amd64.deb" ./
            DEB_FILE="xmcl-${{ steps.version.outputs.version }}-amd64.deb"
          elif [ "${{ matrix.arch }}" = "aarch64" ]; then
            cp "../xmcl-${{ steps.version.outputs.version }}-arm64.deb" ./
            DEB_FILE="xmcl-${{ steps.version.outputs.version }}-arm64.deb"
          fi

          cat > PKGBUILD << EOF
          pkgname=xmcl-launcher
          pkgver=${{ steps.version.outputs.version }}
          pkgrel=1
          pkgdesc="XMCL - A modern Minecraft launcher"
          arch=('${{ matrix.arch }}')
          url="https://xmcl.app/"
          license=('MIT')
          provides=("xmcl")
          conflicts=('xmcl-launcher-bin')
          options=(!strip !debug)
          source=("$DEB_FILE")
          noextract=("$DEB_FILE")
          sha256sums=('SKIP')

          package() {
              cd "\${srcdir}"
              bsdtar -xf "$DEB_FILE" data.tar.xz
              bsdtar -xf data.tar.xz -C "\${pkgdir}"
              install -dv "\${pkgdir}/usr/bin"
          }
          EOF

          # Create makepkg configuration
          cat > /etc/makepkg.conf << EOF
          MAKEFLAGS="-j\$(nproc)"
          PKGEXT='.pkg.tar.zst'
          SRCEXT='.src.tar'
          COMPRESSZST=(zstd -c -T0 -18 -)
          EOF

          # Set permissions and build
          chown -R builder:builder .
          su builder -c "CARCH=${{ matrix.arch }} makepkg -sf --noconfirm"
          if [ -f *.pkg.tar.zst ]; then
            for f in *.pkg.tar.zst; do
              mv "$f" "../xmcl-${{ steps.version.outputs.version }}-${{ matrix.arch }}.pacman"
            done
          fi

      - name: Upload Arch Package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-Arch-${{ matrix.arch }}
          path: ./*.pacman
  prepare-release:
    runs-on: ubuntu-latest
    needs:
      - build
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # Treeless clone: full commit graph (needed by
          # semantic-version-bump-action's `git log <last-tag>..HEAD`)
          # but blobs are fetched on demand. Skips downloading every
          # historical file revision.
          filter: blob:none
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install
        run: |
          pnpm install --frozen-lockfile --filter ./.github/actions
      - name: Bump Version
        id: version
        run: pnpm tsx .github/actions/prepare-pr/index.ts
        env:
          CI: true
      # - name: Update Sponsor
      #   uses: Voxelum/afdian-sponsor-action@3476d33b315b9e7dd33bc6b10863c9c263939a30 # master
      #   with:
      #     user-id: ${{ secrets.AFDIAN_USER_ID }}
      #     token: ${{ secrets.AFDIAN_TOKEN }}
      #     markdown: |
      #       README.md
      #       README.zh.md
      - name: Update Lock File
        if: ${{ steps.version.outputs.release == 'true' }}
        run: pnpm i --lockfile-only
      - name: Create Pull Request
        if: ${{ steps.version.outputs.release == 'true' }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): version ${{ steps.version.outputs.version }}"
          title: Prepare Release ${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.changelog }}
          reviewers: ci010
          assignees: ci010
          branch: prepare-release

  upload-sourcemap:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download Source Map
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sourcemap
          path: sourcemap/${{github.run_number}}
      - name: Upload Source Map to Azure
        uses: ci010/upload-blob-to-azure@91adf4931c299436a9178ff7dd63bdb11ebf8695 # master
        env:
          AZURE_ACCOUNT_KEY: ${{ secrets.AZURE_ACCOUNT_KEY }}
        with:
          account: xmcl
          container: sourcemap
          directory: ./sourcemap

  release:
    if: startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    needs:
      - build
      # - build-arch
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # Treeless clone — see comment on `prepare-release`.
          filter: blob:none
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install
        run: |
          pnpm install --frozen-lockfile --filter action-*
      - name: Download Build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: build-*
          merge-multiple: true
          path: build
      - name: Prepare Release
        id: prepare_release
        uses: Voxelum/semantic-version-bump-action@299dc52f29c2ab5727e1c42fc30e8d46b2f9b8aa # xmcl
        with:
          packages: |
            ./packages/asm
            ./packages/bore
            ./packages/bytebuffer
            ./packages/client
            ./packages/core
            ./packages/curseforge
            ./packages/discord-rpc
            ./packages/file-transfer
            ./packages/forge-site-parser
            ./packages/game-data
            ./packages/gamesetting
            ./packages/installer
            ./packages/instance
            ./packages/mod-parser
            ./packages/model
            ./packages/modrinth
            ./packages/nat-api
            ./packages/nbt
            ./packages/oxlint-config
            ./packages/resource
            ./packages/resourcepack
            ./packages/schematic
            ./packages/semver
            ./packages/sqlite
            ./packages/system
            ./packages/text-component
            ./packages/undici-shim
            ./packages/unzip
            ./packages/user
            ./packages/user-offline-uuid
            ./packages/utils
            ./packages/worker
            ./packages/wrtc-multiplayer
            ./packages/yauzl
            ./xmcl-keystone-ui
            ./xmcl-runtime
            ./xmcl-runtime-api
          root: "."
          stage: "release"
      - name: Create Tag
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/voxelum/x-minecraft-launcher.git"
          git config user.name ci010
          git config user.email cijhn@hotmail.com
          git tag -f ${{ steps.prepare_release.outputs.tag }}
          git push origin tag ${{ steps.prepare_release.outputs.tag }} -f
      - name: Emit Version File
        run: |
          echo ${{ steps.prepare_release.outputs.version }}.${{ github.run_number }} > ./build/version
      - name: Patch download links
        uses: ./.github/actions/patch-release-note
        id: release_note
        with:
          body: ${{ steps.prepare_release.outputs.changelog }}
          version: ${{ steps.prepare_release.outputs.version }}
      - name: Draft Release
        id: create_release
        uses: voxelum/create-release@a2484504cbd96eb95b0097eaccd0d12c5ae7a9b7 # xmcl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag }}
          release_name: ${{ steps.prepare_release.outputs.tag }}
          draft: true
          prerelease: false
          body: ${{ steps.release_note.outputs.body }}
          asset_dir_path: ./build
      - name: Checkout Website
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Voxelum/xmcl-page
          path: xmcl-page
          token: ${{ secrets.PAT_GITHUB_TOKEN }}
      - name: Create Release Note
        uses: ./.github/actions/generate-release-note
        with:
          body: ${{ steps.prepare_release.outputs.changelog }}
          version: ${{ steps.prepare_release.outputs.version }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Push Release Note to xmcl-page
        # Each release produces brand-new `<version>.md` files under
        # `src/<locale>/changelogs/` and `docs/<locale>/changelogs/`, so
        # there's no conflict risk. Skip the PR dance and push directly.
        working-directory: xmcl-page
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changelog changes to commit."
            exit 0
          fi
          git config user.name ci010
          git config user.email cijhn@hotmail.com
          git add -A
          git commit -m "docs: Update ${{ steps.prepare_release.outputs.version }} release note"
          git push origin HEAD:master
