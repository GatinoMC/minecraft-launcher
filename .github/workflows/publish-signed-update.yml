name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-update:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - name: Require the ASAR signing key
        shell: pwsh
        env:
          ASAR_SIGNING_PRIVATE_KEY: ${{ secrets.ASAR_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ASAR_SIGNING_PRIVATE_KEY)) {
            throw 'ASAR_SIGNING_PRIVATE_KEY is not configured.'
          }

      - name: Check out the exact release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag, package version and release state
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'The tag must use the stable vMAJOR.MINOR.PATCH format.'
          }
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion"
          }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'The release already exists; refusing to replace published update assets.'
          }
          exit 0

      - name: Restore Electron caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: windows-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows update bundle from source
        shell: pwsh
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=32768
        run: |
          pnpm build:renderer
          pnpm build:all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign and verify release assets
        shell: pwsh
        env:
          ASAR_SIGNING_PRIVATE_KEY: ${{ secrets.ASAR_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/sign-asar.mjs xmcl-electron-app/build/output
          node scripts/verify-asar-signatures.mjs xmcl-electron-app/build/output

          $version = $env:RELEASE_TAG -replace '^v', ''
          $output = 'xmcl-electron-app/build/output'
          $required = @(
            "app-$version-win.asar",
            "app-$version-win.asar.gz",
            "app-$version-win.asar.sha256",
            "app-$version-win.asar.sha256.sig",
            "minelatino-$version-win32-x64.exe.sha256.sig",
            'manifest.json'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $output $_) -PathType Leaf) }
          if ($missing.Count -gt 0) { throw "Missing updater assets: $($missing -join ', ')" }

          $installers = @(Get-ChildItem $output -Filter "minelatino-$version-win32-x64.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($installer.FullName).sha256", $installerHash)
          $authenticode = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($authenticode.Status -ne 'Valid') {
            Write-Warning "Publishing owner-requested installer without Authenticode (status: $($authenticode.Status))."
          }

      - name: Publish signed updater and Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $output = 'xmcl-electron-app/build/output'
          $assets = @(
            Get-Item (Join-Path $output "app-$version-win.asar")
            Get-Item (Join-Path $output "app-$version-win.asar.gz")
            Get-Item (Join-Path $output "app-$version-win.asar.sha256")
            Get-Item (Join-Path $output "app-$version-win.asar.sha256.sig")
            Get-Item (Join-Path $output 'manifest.json')
            Get-Item (Join-Path $output "minelatino-$version-win32-x64.exe")
            Get-Item (Join-Path $output "minelatino-$version-win32-x64.exe.sha256")
            Get-Item (Join-Path $output "minelatino-$version-win32-x64.exe.sha256.sig")
          ) | Select-Object -ExpandProperty FullName
          & gh release create $env:RELEASE_TAG @assets `
            --title "GatinoLauncher $version" `
            --notes-file "RELEASE-$version.md" `
            --latest
