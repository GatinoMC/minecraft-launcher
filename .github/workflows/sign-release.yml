name: Build and sign Windows release

# SignPath Foundation requires the binary submitted for signing to be built
# automatically from the tagged source. This workflow deliberately rebuilds
# the Windows installer instead of uploading a locally produced release asset.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and sign (for example v0.68.52)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - name: Check SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ASAR_SIGNING_PRIVATE_KEY: ${{ secrets.ASAR_SIGNING_PRIVATE_KEY }}
        run: |
          $required = @(
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG',
            'SIGNPATH_API_TOKEN',
            'ASAR_SIGNING_PRIVATE_KEY'
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace((Get-Item "Env:$_").Value) }
          if ($missing.Count -gt 0) {
            throw "SignPath has not approved/configured this repository yet. Missing: $($missing -join ', ')"
          }

      - name: Check out the exact release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $tagVersion = '${{ inputs.tag }}' -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Tag ${{ inputs.tag }} does not match package version $packageVersion"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Electron caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: windows-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows release from source
        shell: pwsh
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=32768
        run: |
          pnpm build:renderer
          pnpm build:all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem xmcl-electron-app/build/output -Filter 'minelatino-*-win32-x64.exe'
          if ($installer.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installer.Count)"
          }

      - name: Sign ASAR update checksums
        env:
          ASAR_SIGNING_PRIVATE_KEY: ${{ secrets.ASAR_SIGNING_PRIVATE_KEY }}
        run: node scripts/sign-asar.mjs xmcl-electron-app/build/output

      - name: Upload unsigned installer for provenance
        id: upload-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minelatino-windows-unsigned-${{ inputs.tag }}
          path: xmcl-electron-app/build/output/minelatino-*-win32-x64.exe
          if-no-files-found: error

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify signed installer and refresh metadata
        shell: pwsh
        env:
          ASAR_SIGNING_PRIVATE_KEY: ${{ secrets.ASAR_SIGNING_PRIVATE_KEY }}
        run: |
          $installer = Get-ChildItem signed -Recurse -Filter 'minelatino-*-win32-x64.exe'
          if ($installer.Count -ne 1) {
            throw "Expected exactly one signed Windows installer, found $($installer.Count)"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "SignPath returned an installer with signature status $($signature.Status)"
          }

          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($installer.FullName).sha256", $sha256)
          node scripts/sign-asar.mjs $installer.DirectoryName
          node scripts/verify-asar-signatures.mjs $installer.DirectoryName

          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData($bytes))
          $version = '${{ inputs.tag }}' -replace '^v', ''
          $latest = @(
            "version: $version",
            'files:',
            "  - url: $($installer.Name)",
            "    sha512: $sha512",
            "    size: $($installer.Length)",
            "path: $($installer.Name)",
            "sha512: $sha512",
            "releaseDate: '$([DateTime]::UtcNow.ToString('o'))'"
          ) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path signed 'latest.yml'), $latest)
          Write-Host "Verified $($signature.SignerCertificate.Subject)"

      - name: Publish only the signed Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ inputs.tag }}'
          $version = $tag -replace '^v', ''
          $installer = Get-ChildItem signed -Recurse -Filter 'minelatino-*-win32-x64.exe' | Select-Object -First 1
          $releaseAssets = @(
            $installer.FullName,
            "$($installer.FullName).sha256",
            "$($installer.FullName).sha256.sig",
            (Join-Path signed 'latest.yml')
          )
          $releaseAssets += Get-ChildItem xmcl-electron-app/build/output -Filter 'app-*.asar*' | ForEach-Object FullName
          $releaseAssets += Get-Item xmcl-electron-app/build/output/manifest.json | ForEach-Object FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @releaseAssets --clobber
          } else {
            & gh release create $tag @releaseAssets `
              --title "GatinoLauncher $version" `
              --notes-file "RELEASE-$version.md" `
              --latest
          }
