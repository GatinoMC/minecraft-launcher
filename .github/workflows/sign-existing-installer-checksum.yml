name: Sign existing Windows installer checksum

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag whose Windows installer checksum will be signed
        required: true
        type: string

permissions:
  contents: write

jobs:
  sign-checksum:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag and signing key
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ASAR_SIGNING_PRIVATE_KEY: ${{ secrets.ASAR_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'The tag must use the stable vMAJOR.MINOR.PATCH format.' >&2
            exit 1
          fi
          if [[ -z "$ASAR_SIGNING_PRIVATE_KEY" ]]; then
            echo 'ASAR_SIGNING_PRIVATE_KEY is not configured.' >&2
            exit 1
          fi

      - name: Download and verify the published installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          installer="minelatino-$version-win32-x64.exe"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$installer" --pattern "$installer.sha256"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile } from 'node:fs/promises'

          const tag = process.env.RELEASE_TAG
          const version = tag.slice(1)
          const installer = `minelatino-${version}-win32-x64.exe`
          const actual = createHash('sha256').update(await readFile(installer)).digest('hex')
          const expected = (await readFile(`${installer}.sha256`, 'utf8')).trim().toLowerCase()
          if (actual !== expected) throw new Error('Published installer checksum mismatch')
          NODE

      - name: Sign and publish the installer checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          ASAR_SIGNING_PRIVATE_KEY: ${{ secrets.ASAR_SIGNING_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey, createPublicKey, sign, verify } from 'node:crypto'
          import { readFile, writeFile } from 'node:fs/promises'

          const version = process.env.RELEASE_TAG.slice(1)
          const checksumFile = `minelatino-${version}-win32-x64.exe.sha256`
          const checksum = (await readFile(checksumFile, 'utf8')).trim().toLowerCase()
          const privateKey = createPrivateKey(process.env.ASAR_SIGNING_PRIVATE_KEY)
          if (privateKey.asymmetricKeyType !== 'ed25519') throw new Error('Signing key must be Ed25519')
          const signature = sign(null, Buffer.from(checksum, 'ascii'), privateKey)
          if (!verify(null, Buffer.from(checksum, 'ascii'), createPublicKey(privateKey), signature)) {
            throw new Error('Generated installer signature did not verify')
          }
          await writeFile(`${checksumFile}.sig`, `${signature.toString('base64')}\n`, { mode: 0o600 })
          NODE
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "minelatino-$version-win32-x64.exe.sha256.sig" \
            --repo "$GITHUB_REPOSITORY" --clobber
